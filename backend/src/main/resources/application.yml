spring:
  application:
    name: studyloop-backend

  # Pull in local secrets from a git-ignored file (backend/.env.properties).
  # "optional:" = don't crash if the file is missing — in the cloud (Phase 6)
  # the same keys arrive as real environment variables instead.
  config:
    import: optional:file:.env.properties

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # Supabase free tier allows few concurrent connections — keep our pool small.
      maximum-pool-size: 5

  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only checks entities match it at startup.
      ddl-auto: validate
    # Echo generated SQL while debugging: SHOW_SQL=true. Off by default — on a chatty
    # endpoint like ingestion it buries everything else in the log.
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
    # Keeps DB connections out of the web layer; we load what we need inside services.
    open-in-view: false

  servlet:
    multipart:
      # Lecture PDFs can be sizeable; the Spring default (1MB) is too small.
      max-file-size: 25MB
      max-request-size: 25MB

# Our own settings — bound to JwtProperties/CorsProperties via @ConfigurationPropertiesScan.
studyloop:
  jwt:
    # HMAC signing key, >= 32 bytes. Real value: .env.properties locally, secrets in CI/cloud.
    secret: ${JWT_SECRET}
    access-ttl: 15m
    refresh-ttl: 7d
  cors:
    # Browser origins allowed to call the API. The Phase 3 React app runs on Vite's
    # dev server (5173). Override in the cloud via CORS_ALLOWED_ORIGINS (comma-separated).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  storage:
    # Filesystem root for uploaded document bytes. Relative to the backend working dir in
    # dev (→ backend/data/documents, git-ignored); a mounted volume via DOCUMENTS_DIR in the cloud.
    documents-dir: ${DOCUMENTS_DIR:./data/documents}
  embedding:
    # Which backend embeds chunks: "cohere" (hosted, the default) or "google" (hosted), or
    # "ollama" (local, offline). Override with EMBEDDING_PROVIDER (e.g. in the cloud).
    provider: ${EMBEDDING_PROVIDER:cohere}
    cohere:
      # Cohere embed-v4.0 key. Blank when unset → ingestion stores chunks without vectors (no
      # crash). Get a free key at https://dashboard.cohere.com/api-keys. embed-v4.0 emits a
      # 1024-dim Matryoshka vector that the client truncates to `dimensions` to fit vector(768).
      api-key: ${COHERE_API_KEY:}
      model: embed-v4.0
      dimensions: 768
    ollama:
      # Local Ollama server. Pull the model first: `ollama pull qwen3-embedding:0.6b`.
      # dimensions must match the vector(768) column (V6 migration); Qwen3-Embedding is MRL,
      # so 768 is a valid truncation of its native 1024-dim output.
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model: ${OLLAMA_EMBED_MODEL:qwen3-embedding:0.6b}
      dimensions: 768
    google:
      # Google AI Studio key for embeddings. Blank when unset → ingestion stores chunks
      # without vectors (no crash). Set GOOGLE_API_KEY locally / as a cloud secret to enable.
      api-key: ${GOOGLE_API_KEY:}
      model: gemini-embedding-001
  chat:
    # RAG answer generation. "cohere" is the only provider today; the key is shared with
    # embeddings (COHERE_API_KEY). Blank key → the chat endpoint returns a clear 502 instead
    # of crashing at startup.
    provider: ${CHAT_PROVIDER:cohere}
    cohere:
      api-key: ${COHERE_API_KEY:}
      model: ${COHERE_CHAT_MODEL:command-r-08-2024}
    # Confidence gate: the minimum cosine similarity (0..1) the best retrieved chunk must reach
    # for chat to answer. Below it — with no lexical match either — chat replies "not in your
    # materials" instead of guessing. Calibrated against the Phase 5.4 golden set, where genuine
    # on-topic questions bottomed out near 0.30 (avg 0.46); 0.25 leaves a margin below that so a
    # real question in novel wording isn't refused, while off-topic queries stay well under it.
    # Tune per corpus; set to 0 to disable. Override with CHAT_MIN_SIMILARITY.
    min-similarity: ${CHAT_MIN_SIMILARITY:0.25}
    # The same gate on a better signal, used instead of min-similarity whenever the rerank stage
    # ran (Phase 12.2). A cross-encoder relevance score is calibrated 0..1 — it means the same
    # thing for every question, which the cosine above does not — so this is one comparison with
    # no lexical escape hatch behind it.
    #
    # Calibrated against the 11.1 golden set rather than by eye, and re-read after Phase 13 changed
    # what a passage is. On the current corpus the eight unanswerable questions score
    # 0.021 · 0.103 · 0.244 · 0.246 · 0.260 · 0.310 · 0.346 · 0.347 and the lowest *answerable* one
    # scores 0.331, so 0.32 refuses six of the eight and none of the fifty-two real questions.
    #
    # **This number is a property of the chunking, not of the model.** It was 0.25 through Phase 12,
    # where the unanswerable set reached 0.479 and the lowest answerable sat at 0.291. Adaptive
    # chunking moved both ends toward each other from the outside: section-shaped chunks no longer
    # hand a question about Kruskal a stray paragraph that half-answers it (the unanswerable maximum
    # fell 0.479 → 0.347), and a whole section answers a real question better than a window across
    # two of them (the answerable minimum rose 0.291 → 0.331). Left at 0.25 the gate would refuse
    # four of eight rather than six, purely because the pipeline underneath it improved.
    #
    # Two numbers were deliberately not chosen, and the reasoning is the same one Phase 12.2 used.
    # 0.35 would refuse all eight, at the price of one real question in fifty-two: the wrong trade,
    # because a student refused an answer the course does contain has no recourse but the search
    # page, while a weak-context answer still meets a system prompt telling the model to decline.
    # And 0.331 — the highest threshold that costs nothing — is exactly the lowest answerable score,
    # which is fitting the boundary to one corpus. 0.32 sits in the gap between 0.310 and 0.331 with
    # ~0.010 of margin either side; the number rejected in Phase 12 had one thousandth.
    # 0 disables. Override with CHAT_MIN_RELEVANCE.
    min-relevance: ${CHAT_MIN_RELEVANCE:0.32}
  retrieval:
    # Phase 11.3: one switch per retrieval stage, so an A/B against the golden set is a property
    # change rather than a code change. Two runs that differ by a rebuild are not comparable —
    # the "before" pipeline no longer exists to be re-measured. All off is the 11.1 baseline; each
    # later phase flips its own on once its eval run exists to justify it.
    stages:
      # On since Phase 12.1, which is the run that earned it: against the 11.1 baseline on the same
      # sixty questions, Recall@6 0.856 → 0.891, MRR 0.766 → 0.811, nDCG@6 0.765 → 0.796, and the
      # confidence gate went from refusing 0 of 8 unanswerable questions to 5. Set false to
      # reproduce that baseline. A blank COHERE_API_KEY leaves it off whatever this says.
      rerank: ${RETRIEVAL_RERANK:true}
      hyde: ${RETRIEVAL_HYDE:false}
      trigram: ${RETRIEVAL_TRIGRAM:false}
      visual: ${RETRIEVAL_VISUAL:false}
      # Phase 14, and off because it was measured, not because it was never tried. Generating a
      # question list for every section and indexing it beside the section moved Recall@6 from
      # 0.939 to 0.929, nDCG@6 from 0.828 to 0.823, and MRR not at all, on the same sixty
      # questions. That is one synthesis question out of sixty changing hands, which is inside
      # run-to-run noise for a stage whose input is a chat model's output. What it is not is a
      # gain, and it costs about 40 chat calls and seventeen minutes per fourteen-document
      # re-ingest. The technique closes a vocabulary gap between how a student asks and how a
      # textbook writes; this corpus's remaining errors are synthesis and figures, which are
      # different problems. Turn it on for a corpus whose readers and authors do not share a
      # vocabulary, and re-measure before trusting it.
      #
      # The only flag here that is read at ingest rather than at query time. The generated
      # questions live inside the text that was embedded, so flipping this changes nothing about
      # a corpus already in the database: it takes effect on the next ingest, and comparing the
      # two pipelines means re-ingesting (`-Deval.reset=true`). It sits with the query-time flags
      # anyway because the eval report's header is built from this block, and a separate switch
      # that could disagree with it would let the header describe a corpus nobody built.
      synthetic-queries: ${RETRIEVAL_SYNTHETIC_QUERIES:false}
    # How the rerank stage runs when stages.rerank is on. The key is the one embeddings and chat
    # already use; blank leaves the stage off however the switch above is set, so a deployment
    # without a Cohere key keeps working rather than failing every question.
    rerank:
      api-key: ${COHERE_API_KEY:}
      model: ${COHERE_RERANK_MODEL:rerank-v3.5}
      # Candidates fused and handed to the cross-encoder before it picks the top k. Reranking six
      # chunks can only reorder six chunks — the passage RRF put eleventh is the one this stage
      # exists to promote. 30 is inside the 100 documents Cohere bills as one search unit.
      candidates: ${RETRIEVAL_RERANK_CANDIDATES:30}
  chunking:
    # Phase 13 — how a document is cut up at ingest. Not under retrieval.stages, and the difference
    # matters: a stage flag makes two pipelines comparable by restarting, and chunking cannot work
    # that way. The chunks are already in the database when a question arrives, so comparing two
    # chunkers means re-ingesting the corpus (`-Deval.reset=true`), not flipping a switch.
    #
    # A ceiling, not a target. A section that fits becomes one chunk at its own size — 80 tokens or
    # 460 — and nothing is padded or sliced to reach a number. What this caps is the runaway case:
    # a 4,000-token chapter written as one section would otherwise become a single vector that is
    # the average of eight subtopics and a strong match for none of them.
    max-tokens: ${CHUNK_MAX_TOKENS:500}
    # Below this a section is a fragment rather than a retrieval unit ("4.2.1 Analysis", one
    # sentence), so it merges with the sibling after it — never across an H1, never past the
    # ceiling.
    min-tokens: ${CHUNK_MIN_TOKENS:120}
    # Tier 2: embed sentences and cut where adjacent-sentence similarity drops. Only ever runs on a
    # document with no headings at all — a flat slide export, continuous prose. It costs one
    # embedding pass over the whole document on top of the pass that embeds the chunks, so a
    # document that reaches it pays about twice; false sends those documents to the paragraph tier.
    semantic: ${CHUNK_SEMANTIC:true}
    # Sentences tier 2 will embed before deciding the pass costs more than the boundaries are worth.
    semantic-sentence-limit: ${CHUNK_SEMANTIC_SENTENCES:400}
    # Phase 13.4: prepend the document title and heading path to the *embedded* text. A passage
    # reading "the expected search time is O(log n)" is a good passage and a hopeless index entry —
    # what it is about is written three headings above it. false stores no embed_text, so both
    # indexes fall back to `content`, which is exactly the pre-13.4 pipeline.
    context-header: ${CHUNK_CONTEXT_HEADER:true}
    # Phase 13.5: retrieve on chunks, then hand the model the whole section each hit came from.
    # Retrieval precision and generation context are different budgets — a big chunk embeds to the
    # average of its subtopics, a big prompt is just a prompt. Citations still point at the chunk.
    expand-to-section: ${CHUNK_EXPAND_TO_SECTION:true}
    # Ceiling per source once expanded. Six sources at 1,200 tokens is a ~7k-token prompt; six
    # unbounded chapters is not affordable and is not more useful.
    expansion-max-tokens: ${CHUNK_EXPANSION_MAX_TOKENS:1200}
    # Phase 14.1 — the shape of the synthetic-query block, not whether it is written. That switch
    # is retrieval.stages.synthetic-queries above, the same split the rerank stage uses.
    synthetic-queries:
      # Questions asked for per section. ZenLearn's generator asks for 15-20 per source file, which
      # is free there because they land in metadata; here they land in the text that is embedded,
      # so twenty short questions against a 300-token section drag its vector toward
      # "question-shaped text" and away from what the section actually says.
      per-section: ${SYNTHETIC_QUERIES_PER_SECTION:6}
      # Sections per provider call. The plan said one call per section; on the eval corpus that is
      # 282 chat calls for a single re-ingest, against a trial key allowing twenty a minute and a
      # thousand a month. The token bill is identical either way — the call count is what the
      # provider limits, and eight sections a call makes it thirty.
      batch-size: ${SYNTHETIC_QUERIES_BATCH:8}
      # Ceiling on the block as a fraction of the section's own tokens, which is the dilution limit
      # per-section alone cannot express: six questions is modest against a 400-token section and
      # half the text of an 80-token one. A section too small for even one question is skipped
      # before it costs a call.
      share: ${SYNTHETIC_QUERIES_SHARE:0.20}
      # The plan's eligibility rule: generate only for sections the document delimited, never for a
      # piece the 500-token ceiling had to cut out of one. Off, and the measurement is why — on the
      # fixture corpus it reached 13 chunks out of 282, because a textbook section is routinely
      # longer than the ceiling, so nearly every chunk is a piece of one. A tier-3 piece is cut on
      # paragraph boundaries and carries its heading path, so it is coherent prose under a known
      # topic; and the risk the rule guarded against is already carried by the reranker, which
      # scores `content` and never sees the generated block. Kept switchable so both sides of that
      # measurement can be re-run.
      whole-sections-only: ${SYNTHETIC_QUERIES_WHOLE_SECTIONS_ONLY:false}
  vision:
    # Phase 15 — the VLM extraction router. Every page is scored after PDFBox reads it, and only
    # the pages PDFBox got wrong are sent to a vision model.
    #
    # On by default, and the reason is that it costs nothing on material that does not need it. A
    # clean digital textbook routes no pages, so the whole feature is four cheap measurements per
    # page and no provider call at all; a scanned book routes every page, which is what the
    # per-document cap below is for. Off reproduces the pre-Phase-15 pipeline exactly: whatever
    # PDFBox produced is what gets indexed, defects and all.
    #
    # Not under retrieval.stages, unlike Phase 14's synthetic queries. Those had to be there because
    # the eval report's header is built from that block and nothing else recorded what the corpus
    # was built with. This phase records it per document, in documents.vision_pages, so the report
    # reads the corpus instead of the configuration and cannot be made to lie by forgetting to
    # re-ingest.
    enabled: ${VISION_ENABLED:true}
    # Google AI Studio key — the same one the google embedding provider uses. Blank leaves the
    # router scoring pages and routing none of them, logging at WARN what it would have sent: an
    # installation with no vision key keeps ingesting rather than failing every upload with a
    # figure in it. Cohere has no vision model, which is why this is a second provider at all.
    api-key: ${GOOGLE_API_KEY:}
    # Gemini 2.5 Flash. Thinking is disabled in the client: reasoning before answering is worth
    # paying for on a hard question and not on transcribing a page that is in front of the model.
    model: ${VISION_MODEL:gemini-2.5-flash}
    # Render resolution. 150 is the floor at which body text in a scanned book stays legible; 72
    # (one PDF point per pixel) loses the ascenders, and 300 quadruples the bytes for text that was
    # already readable at 150.
    dpi: ${VISION_DPI:150}
    # Phase 15.3's guardrail, and the reason the phase is a router rather than "send everything".
    # Phase 10 capped the *query* path — 20 AI requests a minute, 200k tokens a day, per user. This
    # is the ingest path, whose only limit is 10 uploads an hour, sized for text extraction. One
    # scanned 300-page textbook is 300 vision calls inside a single allowed upload.
    #
    # Exceeding it refuses the document rather than routing the first 40 pages and stopping. A
    # truncated document reaches READY with the right page count and no answers past page 40, and
    # every symptom of that is silence.
    max-pages-per-document: ${VISION_MAX_PAGES:40}
    # Scripts this corpus is expected to be written in, for the broken-encoding signal. Unicode
    # script names as Character.UnicodeScript spells them, comma-separated.
    #
    # Configurable because "outside the expected script" is a property of the course, not of the
    # software: a Bangla course under a Latin-only rule would have every page flagged, which is the
    # exact false positive that would make the signal useless where it is most needed. COMMON is
    # digits, punctuation and maths operators; GREEK is here because a computer science textbook is
    # full of Theta and epsilon and neither of those is a defect.
    expected-scripts: ${VISION_EXPECTED_SCRIPTS:LATIN,COMMON,GREEK,INHERITED}
    # Phase 16.3 — how sure the model has to say it is before a block of a photographed note is
    # written into the course's index.
    #
    # Handwriting recognition is wrong routinely rather than exceptionally, and the failure mode is
    # a plausible wrong reading rather than an obvious one: a guessed recurrence relation looks
    # exactly like a read one, and it will be cited back to the student as their own note. Blocks
    # below this are stored and shown and not indexed, so the gap is visible instead of silent.
    #
    # 0.6 is deliberately generous. Keeping a doubtful block costs one weak passage among many;
    # dropping a good one costs a note that answers nothing.
    min-note-confidence: ${VISION_MIN_NOTE_CONFIDENCE:0.6}
    # Where each of the four signals tips from "this page extracted fine" to "PDFBox is guessing".
    # Configuration rather than constants because the right cut for a scanned handout is not the
    # right cut for a typeset textbook, and a reader who disagrees with a threshold should be able
    # to move it and re-run FixtureCorpusTest rather than rebuild.
    thresholds:
      # Characters extracted per 1,000 square points of page. A US Letter page is ~485 of those
      # units and a page of prose yields 4-6 characters per unit, so 0.5 is "this page produced
      # under a tenth of the text a page of writing produces".
      min-chars-per-thousand-points: ${VISION_MIN_CHARS:0.5}
      # Low text *and* a page-filling image is a scan. Low text and no image is a blank page or a
      # chapter opener, and sending those to a vision model buys a call and an empty answer — which
      # is why every low-text verdict also requires an image to be there.
      scanned-image-coverage: ${VISION_SCANNED_COVERAGE:0.5}
      # A figure page is the same shape with the dial turned down: a real diagram over a quarter of
      # the page, with enough text around it to show extraction is working. The text is fine and it
      # is not what the page is about — which is why figure questions have been the weakest column
      # in the golden set since Phase 12, and why Phase 14's generated text did nothing for them.
      figure-image-coverage: ${VISION_FIGURE_COVERAGE:0.25}
      # The same judgement for a figure that was *drawn* rather than pasted, counted in path
      # segments. This threshold is not in the plan, and measuring the corpus is why it exists: the
      # fourteen fixture chapters contain zero image XObjects across all 306 of their pages, because
      # a book typeset in LaTeX emits its diagrams as vector artwork. Left with coverage alone, the
      # figure rule could never fire on the very corpus whose figure questions are the weakest
      # column in the golden set. A rule under a heading is one or two segments, a page of prose
      # sits around thirty, and a tree diagram is several hundred.
      figure-vector-segments: ${VISION_FIGURE_SEGMENTS:150}
      figure-chars-per-thousand-points: ${VISION_FIGURE_CHARS:2.0}
      # Share of non-space characters belonging to no expected script. A broken /ToUnicode CMap does
      # not fail — it succeeds and returns the wrong codepoints, usually from the private use area,
      # so the page renders perfectly and pastes as gibberish.
      max-foreign-ratio: ${VISION_MAX_FOREIGN:0.30}
      # How far PDFBox's position-sorted reading of the page diverges from its content-stream
      # reading. They agree almost exactly on single-column prose; a two-column page read in stream
      # order interleaves the columns and the two orders share almost no positions. This is also
      # the signal that rules out plain OCR as the fallback — Tesseract guesses reading order the
      # same way, so it would fix the scans and reproduce this.
      max-order-disagreement: ${VISION_MAX_DISAGREEMENT:0.35}
  summary:
    # Phase 8.2: after a document reaches READY, generate its summary + glossary once and cache
    # them. Costs one chat call per document, never repeated. Set false (SUMMARY_AUTO_GENERATE)
    # to keep bulk imports off the provider — POST /documents/{id}/summary still works on demand.
    auto-generate: ${SUMMARY_AUTO_GENERATE:true}
  semantic-cache:
    # Phase 8.3: answers are cached against the *meaning* of the question, so a paraphrase of
    # something already asked is served from the database instead of the model. Set false
    # (SEMANTIC_CACHE_ENABLED) to send every question to the provider — the useful comparison
    # when demonstrating what the cache is worth.
    enabled: ${SEMANTIC_CACHE_ENABLED:true}
    # Cosine similarity a previous question must reach before its answer is reused. High on
    # purpose: 0.97 is "these are the same question worded differently", not "same topic". Serving
    # a stale answer to a subtly different question is the failure mode worth paying to avoid, so
    # this errs toward calling the model. Override with SEMANTIC_CACHE_MIN_SIMILARITY.
    min-similarity: ${SEMANTIC_CACHE_MIN_SIMILARITY:0.97}
    # Backstop only — uploading a document already clears that course's cache outright.
    ttl: ${SEMANTIC_CACHE_TTL:30d}
  analytics:
    # Phase 9.1: every chat question is recorded — its embedding, whether the corpus could ground
    # an answer, and which lectures it landed on — so an instructor can see what the class is
    # stuck on. Set false (ANALYTICS_ENABLED) to answer questions without keeping them.
    enabled: ${ANALYTICS_ENABLED:true}
    # Cosine similarity two questions must reach to count as the same topic. Far below the
    # semantic cache's 0.97, and for the opposite reason: the cache is deciding whether to reuse
    # an answer, where a near-miss is a wrong answer, while this is deciding whether two students
    # are confused about the same thing. At 0.82 "what is a closure" groups with "how do closures
    # capture variables"; at 0.95 every rewording becomes its own topic and the page says nothing.
    cluster-threshold: ${ANALYTICS_CLUSTER_THRESHOLD:0.82}
    # Newest N questions per course fed to the clusterer. Bounds the work and keeps the picture
    # current — what the class struggled with in week 1 is not today's problem.
    cluster-window: ${ANALYTICS_CLUSTER_WINDOW:500}
    # How many topics and individual unanswered questions the API returns.
    max-topics: ${ANALYTICS_MAX_TOPICS:20}
    max-ungrounded: ${ANALYTICS_MAX_UNGROUNDED:25}
    # The warming sweep. The instructor page recomputes stale clusters itself, so these only
    # decide how often that cost is paid in the background instead of in front of someone.
    cluster-interval: ${ANALYTICS_CLUSTER_INTERVAL:PT15M}
    cluster-initial-delay: ${ANALYTICS_CLUSTER_INITIAL_DELAY:PT2M}
  quota:
    # Phase 10: the two guardrails on the paid surface, both per user. They are separate switches
    # because they fail differently — a rate limit clears in seconds, a spent budget does not.
    rate-limit:
      # Off (RATE_LIMIT_ENABLED=false) removes the limiter entirely, which is the comparison to
      # run if a demo starts answering 429 unexpectedly.
      enabled: ${RATE_LIMIT_ENABLED:true}
      # Endpoints that call the model or the embedder: chat, search, quizzes, flashcards,
      # summaries. A token bucket, so the allowance refills continuously rather than resetting on
      # a boundary — 20 is far above anyone typing questions and far below anything scripted.
      ai-requests: ${RATE_LIMIT_AI_REQUESTS:20}
      ai-window: ${RATE_LIMIT_AI_WINDOW:1m}
      # Uploads get their own, much smaller allowance: one PDF is an embedding call per batch of
      # chunks plus a summary call, so request count is a poor proxy for what it costs.
      uploads: ${RATE_LIMIT_UPLOADS:10}
      upload-window: ${RATE_LIMIT_UPLOAD_WINDOW:1h}
      # How often idle buckets are swept out of memory. Not a limit, just housekeeping.
      prune-interval: ${RATE_LIMIT_PRUNE_INTERVAL:PT10M}
    budget:
      enabled: ${TOKEN_BUDGET_ENABLED:true}
      # Input + output tokens one user may spend per window, read from the ai_usage_events ledger.
      # 200k is roughly 60 grounded chat answers or a dozen quiz generations — generous for a
      # student, and a hard ceiling on what one compromised account can cost in a day.
      tokens: ${TOKEN_BUDGET_TOKENS:200000}
      # Rolling, not calendar: spend ages out gradually instead of everyone resetting at the same
      # midnight, and there is no question of whose midnight it is.
      window: ${TOKEN_BUDGET_WINDOW:24h}
  pricing:
    # What each recorded provider call costs, for /admin/costs. These are Cohere's published list
    # prices; a model with no entry here is still recorded, just costed at zero. Keys need
    # [brackets] because Spring otherwise reads the dot in a model name as nesting.
    models:
      "[command-r-08-2024]":
        input-per-million: 0.15
        output-per-million: 0.60
      # Embeddings bill on input only — nothing is generated.
      "[embed-v4.0]":
        input-per-million: 0.12
        output-per-million: 0
      # Reranking bills per search, not per token: one call over a batch of up to 100 passages is
      # one search unit whatever those passages weigh. $2.00 per 1,000 searches — about $0.002 on
      # every question, which is why the dashboard needs to show it rather than infer it.
      "[rerank-v3.5]":
        per-thousand-searches: 2.00
      # Phase 15's vision extractor, and the only Google entry here. Images bill as input tokens —
      # a 150-DPI page is roughly 250-400 of them under Gemini's tiling — so a routed page costs a
      # fraction of a cent in and rather more out, because the output is the page rewritten as
      # Markdown. Output is eight times the input rate, which is the arithmetic behind switching
      # thinking off in the client: reasoning tokens bill at that same output rate.
      "[gemini-2.5-flash]":
        input-per-million: 0.30
        output-per-million: 2.50

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Dev convenience: show the db component inside /actuator/health.
      show-details: always
