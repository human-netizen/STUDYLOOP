# Phase 10.1: the suite gets its own Supabase project, never the one the app runs against.
#
# The datasource is redirected; everything else stays as main's application.yml declares it, so a
# test exercises the real configuration rather than a simplified copy of it. The handful of
# exceptions below are all one idea — **a developer's `.env.properties` must not be able to change
# what the suite proves** — and each carries the reason it was added.
#
# The placeholders have no defaults on purpose. A missing TEST_DB_URL fails the context outright,
# which is the entire point of this file: the failure this profile exists to prevent is a suite
# that quietly falls back to the development database and deletes something in it. A loud startup
# failure is recoverable; a truncated demo course the day before a viva is not.
spring:
  datasource:
    url: ${TEST_DB_URL}
    username: ${TEST_DB_USERNAME}
    password: ${TEST_DB_PASSWORD}
    # Phase 26.4 — **the arithmetic that decides this is contexts × pool, not tests × anything.**
    #
    # Spring caches one ApplicationContext per distinct test configuration and never closes them
    # while the suite runs, so every `@TestConfiguration` and every `properties = ...` override is
    # another Hikari pool held open until the JVM exits. Main's pool is 5, and Hikari's `minimumIdle`
    # defaults to `maximumPoolSize` — so each pool *eagerly opens five connections and keeps them*.
    # Seven contexts fitted inside Supabase's fifteen-client session-pooler cap by luck; the eighth
    # did not, and the symptom is the least helpful one available: a context that fails to start
    # with "Connection is not available, request timed out after 30001ms" in a test class that
    # touched nothing to do with connections.
    #
    # Two numbers, and the first is the one that matters. `minimum-idle: 1` means a context that is
    # not running holds one connection instead of five, which is what makes the count scale with
    # contexts *in use* rather than contexts that exist. `maximum-pool-size: 3` is enough for the
    # widest thing the suite does — a real-port test whose request thread, ingestion executor and
    # chat stream executor can all want a connection at once — and small enough that two such
    # contexts running back to back cannot reach the cap between them.
    hikari:
      minimum-idle: 1
      maximum-pool-size: 3
      # Drop back to the minimum quickly once a test class is done, rather than holding three
      # connections for Hikari's default ten minutes while the next context tries to start.
      idle-timeout: 30000

# The one exception to "only the datasource is redirected", added in Phase 12.1 for the same
# reason. The rerank stage ships on, and unlike the embedding and chat clients it is reached by
# *any* retrieval call — so a test class that never thought about AI would start billing Cohere the
# moment it searched a course. Blanked here, the stage switches itself off everywhere; StubAiConfig
# hands the tests that want it a deterministic reranker instead.
studyloop:
  retrieval:
    rerank:
      api-key: ""
  # Phase 15 adds a second key with the same hazard, and a worse one: the router ships on and every
  # PDF the suite builds goes through it, so a developer with GOOGLE_API_KEY in .env.properties
  # would have the whole test suite billing Google for pages of Lorem Ipsum. Blanked here the
  # router still scores every page — which is the part the tests are about — and sends none of
  # them; VisionRoutingTest hands the router a deterministic stub reader instead.
  vision:
    api-key: ""
  # Phase 21. On for the suite, which is the opposite of the two entries above and for a
  # complementary reason: those blank a key so no test can reach a paid provider by accident, and
  # this one switches a feature on so the video tests do not need a `properties` override of their
  # own. An override there would fork the ApplicationContext — a second Hikari pool against a
  # fifteen-client cap — to say something that is true for the whole suite anyway. Nothing can reach
  # a real renderer regardless: StubAiConfig publishes a stub `VideoWorker`.
  video:
    enabled: true
    # Under target/, so `mvn clean` takes the test renders with it and nothing lands in the
    # directory the development server serves from.
    videos-dir: ./target/test-videos
    # **Pinned, because a limit a test asserts on cannot be a limit the developer can change.**
    # Both of these are `${VAR:default}` in application.yml, so a `VIDEO_DAILY_CAP=20` line in a
    # git-ignored `.env.properties` — added to get through an afternoon of debugging renders —
    # reaches the suite too, and `theDailyCapRefusesTheNextRequest` fails with 202 instead of 429.
    # It looks like a broken cap and is a broken test environment. Same hazard as the two blanked
    # keys above, one step further on: those stop a test *doing* something expensive, these stop a
    # developer's machine *deciding* what a test proves.
    daily-cap-per-user: 3

  quota:
    budget:
      # Pinned for the reason directly above, and the number QuotaTest hard-codes. That test says
      # it hard-codes 200k so it cannot pass with the code and the config both wrong; this line is
      # what makes the hard-coding true on every machine rather than only on one with an untouched
      # environment.
      tokens: 200000
