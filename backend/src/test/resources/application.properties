# Turns on application-test.yml for every test. This file lives in src/test/resources, so it is
# on the classpath only while tests run and cannot affect the application.
#
# Activation lives here rather than in surefire's configuration so that a test launched from
# IntelliJ takes the same path as one launched by Maven. A profile that only Maven sets is worse
# than no profile at all: the single-test run you do while debugging would be the one still
# pointed at the development database.
spring.profiles.active=test
